name: Static checks (public source beta)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax (no dependency installation, no network listeners)
        shell: bash
        run: |
          set -euo pipefail
          find scripts test bin public -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -print0 | xargs -0 -r -n 1 node --check
          echo "Static JavaScript syntax check passed"
      - name: Validate isolated default access policy (no dependencies required)
        run: node ./test/community-defaults.test.js
      # The Windows GUI/CDP/OAuth integration smoke suite is run on an interactive
      # Windows host; headless Linux CI cannot verify native WinApp CLI behavior.
